name: build_and_test

on: [push, pull_request]

jobs:
  docs:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: prepare
      run: |
        sudo apt-get update
        sudo apt-get install codespell
        sudo apt-get install python3-sphinx
    - name: spellcheck
      run: |
        make codespell
    - name: docs
      run: |
        make docs
  android-arm:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: prepare
      run: |
        sudo apt-get update
        sudo apt-get install libc6-dev-i386
        ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        SDKMANAGER=${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager
        echo "y" | $SDKMANAGER "ndk;23.2.8568313"
    - name: android-arm-make-debug
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313
        export ANDROID_NDK_ABI=23
        make MAKE_JOBS=4 android-arm-debug
    - name: android-arm-make-development
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313
        export ANDROID_NDK_ABI=23
        make MAKE_JOBS=4 android-arm-development
    - name: android-arm-make-release
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313
        export ANDROID_NDK_ABI=23
        make MAKE_JOBS=4 android-arm-release
    - name: android-arm64-make-debug
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313
        export ANDROID_NDK_ABI=23
        make MAKE_JOBS=4 android-arm64-debug
    - name: android-arm64-make-development
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313
        export ANDROID_NDK_ABI=23
        make MAKE_JOBS=4 android-arm64-development
    - name: android-arm64-make-release
      run: |
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313
        export ANDROID_NDK_ABI=23
        make MAKE_JOBS=4 android-arm64-release
  html5:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: prepare
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install latest
        ./emsdk activate latest
    - name: wasm-make-debug
      run: |
        export EMSCRIPTEN=$GITHUB_WORKSPACE/emsdk/upstream/emscripten
        make MAKE_JOBS=4 wasm-debug
    - name: wasm-test-debug
      run: |
        cd ./build/wasm/bin && node crown-debug --run-unit-tests
    - name: wasm-make-development
      run: |
        export EMSCRIPTEN=$GITHUB_WORKSPACE/emsdk/upstream/emscripten
        make MAKE_JOBS=4 wasm-development
    - name: wasm-test-development
      run: |
        cd ./build/wasm/bin && node crown-development --run-unit-tests
    - name: wasm-make-release
      run: |
        export EMSCRIPTEN=$GITHUB_WORKSPACE/emsdk/upstream/emscripten
        make MAKE_JOBS=4 wasm-release
    - name: wasm-test-release
      run: |
        cd ./build/wasm/bin && node crown-release --run-unit-tests
    - name: wasm64-make-debug
      run: |
        export EMSCRIPTEN=$GITHUB_WORKSPACE/emsdk/upstream/emscripten
        make MAKE_JOBS=4 wasm64-debug
    - name: wasm64-test-debug
      run: |
        cd ./build/wasm64/bin && node crown-debug --run-unit-tests
    - name: wasm64-make-development
      run: |
        export EMSCRIPTEN=$GITHUB_WORKSPACE/emsdk/upstream/emscripten
        make MAKE_JOBS=4 wasm64-development
    - name: wasm64-test-development
      run: |
        cd ./build/wasm64/bin && node crown-development --run-unit-tests
    - name: wasm64-make-release
      run: |
        export EMSCRIPTEN=$GITHUB_WORKSPACE/emsdk/upstream/emscripten
        make MAKE_JOBS=4 wasm64-release
    - name: wasm64-test-release
      run: |
        cd ./build/wasm64/bin && node crown-release --run-unit-tests
  linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: prepare
      run: |
        sudo apt-get update
        sudo apt-get install mesa-common-dev libgl1-mesa-dev libpulse-dev libxkbcommon-dev libxrandr-dev libdecor-0-dev
        sudo apt-get install gcc-multilib g++-multilib libc6-dev-i386
    - name: linux-make-debug64
      run: |
        make MAKE_JOBS=4 linux-debug64
    - name: linux-test-debug64
      run: |
        cd ./build/linux64/bin && ./crown-debug --run-unit-tests
    - name: linux-make-development64
      run: |
        make MAKE_JOBS=4 linux-development64
    - name: linux-test-development64
      run: |
        cd ./build/linux64/bin && ./crown-development --run-unit-tests
    - name: linux-make-release64
      run: |
        make MAKE_JOBS=4 linux-release64
    - name: linux-test-release64
      run: |
        cd ./build/linux64/bin && ./crown-release --run-unit-tests
    - name: linux-make-debug32
      run: |
        make MAKE_JOBS=4 linux-debug32
    - name: linux-make-development32
      run: |
        make MAKE_JOBS=4 linux-development32
    - name: linux-compile-samples-android
      run: |
        make MAKE_JOBS=4 samples SAMPLES_PLATFORM=android
    - name: linux-compile-samples-html5
      run: |
        make MAKE_JOBS=4 samples SAMPLES_PLATFORM=html5
    - name: linux-compile-samples-linux
      run: |
        make MAKE_JOBS=4 samples SAMPLES_PLATFORM=linux
    - name: linux-make-crown-launcher-debug64
      run: |
        make MAKE_JOBS=4 crown-launcher-linux-debug64
    - name: linux-make-crown-launcher-release64
      run: |
        make MAKE_JOBS=4 crown-launcher-linux-release64
  windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
    - name: mingw-prepare
      shell: msys2 {0}
      run: |
        pacman --noconfirm -S make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-gtk3 mingw-w64-x86_64-vala gettext
    - name: mingw-make-debug64
      shell: msys2 {0}
      run: |
        export MINGW=/mingw64
        make MAKE_JOBS=4 mingw-debug64
    - name: mingw-test-debug64
      shell: msys2 {0}
      run: |
        build/mingw64/bin/crown-debug.exe --run-unit-tests
    - name: mingw-make-development64
      shell: msys2 {0}
      run: |
        export MINGW=/mingw64
        make MAKE_JOBS=4 mingw-development64
    - name: mingw-test-development64
      shell: msys2 {0}
      run: |
        build/mingw64/bin/crown-development.exe --run-unit-tests
    - name: mingw-make-release64
      shell: msys2 {0}
      run: |
        export MINGW=/mingw64
        make MAKE_JOBS=4 mingw-release64
    - name: mingw-test-release64
      shell: msys2 {0}
      run: |
        build/mingw64/bin/crown-release.exe --run-unit-tests
    - name: mingw-compile-samples-windows
      shell: msys2 {0}
      run: |
        export MINGW=/mingw64
        make MAKE_JOBS=4 samples SAMPLES_PLATFORM=windows
    - name: mingw-make-crown-launcher-debug64
      shell: msys2 {0}
      run: |
        export MINGW=/mingw64
        make MAKE_JOBS=4 crown-launcher-mingw-debug64
    - name: mingw-make-crown-launcher-release64
      shell: msys2 {0}
      run: |
        export MINGW=/mingw64
        make MAKE_JOBS=4 crown-launcher-mingw-release64
  linux-tools:
    name: linux-tools-${{ matrix.toolkit }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
        - toolkit: gtk3
          target_suffix: ""
        - toolkit: gtk4
          target_suffix: -gtk4
    env:
      GCC16_ROOT: /opt/gcc-16.2.0
      GCC16_GDRIVE_FILE_ID: 1QsuKc06WHJj6FNuohwyG99L5f5rUww1p
      GCC16_SHA256_GDRIVE_FILE_ID: 1mn6bUGPKPcAkhUlrHhieRH89as0Eqa5y
      GTK3_VERSION: 3.24.52
      GTK3_ROOT: /opt/gtk-3.24.52
      GTK3_GDRIVE_FILE_ID: 1F5OyK1IUkHsI33-2iaCjPslC5SFc7MaU
      GTK3_SHA256_GDRIVE_FILE_ID: 1-FSyTMH_giMJqhVZ7GsDtPd81sKjf6ux
      GTK4_VERSION: 4.22.5
      GTK4_ROOT: /opt/gtk-4.22.5
      GTK4_GDRIVE_FILE_ID: ${{ vars.GTK4_GDRIVE_FILE_ID }}
      GTK4_SHA256_GDRIVE_FILE_ID: ${{ vars.GTK4_SHA256_GDRIVE_FILE_ID }}
    steps:
    - uses: actions/checkout@v6
    - name: prepare
      run: |
        sudo add-apt-repository ppa:vala-team -y
        sudo apt-get update
        sudo apt-get install -y valac sassc libxml2-utils gettext
        sudo apt-get install -y libmount-dev libselinux1-dev libdbus-1-dev libxtst-dev libjbig0 libdrm-dev \
          libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev libxinerama-dev \
          libxfixes-dev libxcursor-dev libxdamage-dev libxcomposite-dev \
          libxcb1-dev libxcb-shm0-dev libxcb-render0-dev libxcb-xkb-dev \
          libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev
    - name: install-gcc16
      run: |
        set -euo pipefail
        archive="gcc-16.2.0-ubuntu22.04-amd64.tar.xz"
        cd "${RUNNER_TEMP}"
        curl --fail --location --retry 5 --retry-all-errors \
          "https://drive.usercontent.google.com/download?id=${GCC16_GDRIVE_FILE_ID}&export=download&confirm=t" \
          --output "$archive"
        curl --fail --location --retry 5 --retry-all-errors \
          "https://drive.usercontent.google.com/download?id=${GCC16_SHA256_GDRIVE_FILE_ID}&export=download&confirm=t" \
          --output "$archive.sha256"
        sha256sum --check "$archive.sha256"
        sudo tar -xJf "$archive" -C /
        export LD_LIBRARY_PATH="${GCC16_ROOT}/lib64:${GCC16_ROOT}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        "${GCC16_ROOT}/bin/gcc" --version
        "${GCC16_ROOT}/bin/g++" --version
        echo "${GCC16_ROOT}/bin" >> "$GITHUB_PATH"
        echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
    - name: install-gtk3
      if: matrix.toolkit == 'gtk3'
      run: |
        set -euo pipefail
        archive="gtk-${GTK3_VERSION}-ubuntu22.04-amd64.tar.xz"
        cd "${RUNNER_TEMP}"
        curl --fail --location --retry 5 --retry-all-errors \
          "https://drive.usercontent.google.com/download?id=${GTK3_GDRIVE_FILE_ID}&export=download&confirm=t" \
          --output "$archive"
        curl --fail --location --retry 5 --retry-all-errors \
          "https://drive.usercontent.google.com/download?id=${GTK3_SHA256_GDRIVE_FILE_ID}&export=download&confirm=t" \
          --output "$archive.sha256"
        sha256sum --check "$archive.sha256"
        sudo tar -xJf "$archive" -C /
        source "${GTK3_ROOT}/activate.sh"
        test "$(pkg-config --modversion gtk+-3.0)" = "$GTK3_VERSION"
        test "$(pkg-config --variable=prefix gtk+-3.0)" = "$GTK3_ROOT"
        echo "${GTK3_ROOT}/bin" >> "$GITHUB_PATH"
        for variable in PKG_CONFIG_PATH LD_LIBRARY_PATH GI_TYPELIB_PATH XDG_DATA_DIRS GDK_PIXBUF_MODULEDIR GDK_PIXBUF_MODULE_FILE; do
          printf '%s=%s\n' "$variable" "${!variable}" >> "$GITHUB_ENV"
        done
    - name: install-gtk4
      if: matrix.toolkit == 'gtk4'
      run: |
        set -euo pipefail
        : "${GTK4_GDRIVE_FILE_ID:?Set the GTK4_GDRIVE_FILE_ID repository variable}"
        : "${GTK4_SHA256_GDRIVE_FILE_ID:?Set the GTK4_SHA256_GDRIVE_FILE_ID repository variable}"
        archive="gtk-${GTK4_VERSION}-ubuntu22.04-amd64.tar.xz"
        cd "${RUNNER_TEMP}"
        curl --fail --location --retry 5 --retry-all-errors \
          "https://drive.usercontent.google.com/download?id=${GTK4_GDRIVE_FILE_ID}&export=download&confirm=t" \
          --output "$archive"
        curl --fail --location --retry 5 --retry-all-errors \
          "https://drive.usercontent.google.com/download?id=${GTK4_SHA256_GDRIVE_FILE_ID}&export=download&confirm=t" \
          --output "$archive.sha256"
        sha256sum --check "$archive.sha256"
        sudo tar -xJf "$archive" -C /
        source "${GTK4_ROOT}/activate.sh"
        test "$(pkg-config --modversion gtk4)" = "$GTK4_VERSION"
        test "$(pkg-config --variable=prefix gtk4)" = "$GTK4_ROOT"
        echo "${GTK4_ROOT}/bin" >> "$GITHUB_PATH"
        for variable in PKG_CONFIG_PATH LD_LIBRARY_PATH GI_TYPELIB_PATH XDG_DATA_DIRS; do
          printf '%s=%s\n' "$variable" "${!variable}" >> "$GITHUB_ENV"
        done
    - name: linux-make-crown-editor-debug64
      run: |
        make MAKE_JOBS=4 crown-editor-theme${{ matrix.target_suffix }}
        make MAKE_JOBS=4 crown-editor-linux-debug64${{ matrix.target_suffix }}
    - name: linux-test-crown-editor-debug64
      run: |
        cd ./build/linux64/bin && ./crown-editor-debug --run-unit-tests
    - name: linux-make-crown-editor-release64
      run: |
        make MAKE_JOBS=4 crown-editor-theme${{ matrix.target_suffix }}
        make MAKE_JOBS=4 crown-editor-linux-release64${{ matrix.target_suffix }}
    - name: linux-test-crown-editor-release64
      run: |
        cd ./build/linux64/bin && ./crown-editor-release --run-unit-tests
  mingw-tools:
    name: mingw-tools-${{ matrix.toolkit }}
    runs-on: windows-2022
    strategy:
      matrix:
        include:
        - toolkit: gtk3
          package: mingw-w64-x86_64-gtk3
          target_suffix: ""
        - toolkit: gtk4
          package: mingw-w64-x86_64-gtk4
          target_suffix: -gtk4
    steps:
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
    - name: prepare
      shell: msys2 {0}
      run: |
        pacman --noconfirm -S make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf ${{ matrix.package }} mingw-w64-x86_64-vala mingw-w64-x86_64-sassc gettext
    - name: mingw-make-crown-editor-debug64
      shell: msys2 {0}
      run: |
        export MINGW=/mingw64
        make MAKE_JOBS=4 crown-editor-theme${{ matrix.target_suffix }}
        make MAKE_JOBS=4 crown-editor-mingw-debug64${{ matrix.target_suffix }}
    - name: mingw-test-crown-editor-debug64
      shell: msys2 {0}
      run: |
        build/mingw64/bin/crown-editor-debug.exe --run-unit-tests
    - name: mingw-make-crown-editor-release64
      shell: msys2 {0}
      run: |
        export MINGW=/mingw64
        make MAKE_JOBS=4 crown-editor-theme${{ matrix.target_suffix }}
        make MAKE_JOBS=4 crown-editor-mingw-release64${{ matrix.target_suffix }}
    - name: mingw-test-crown-editor-release64
      shell: msys2 {0}
      run: |
        build/mingw64/bin/crown-editor-release.exe --run-unit-tests
  code-style:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: format
      run: |
        make MAKE_JOBS=4 format-sources
    - name: check-diff
      run: |
        exit `git diff --shortstat | wc -l`
