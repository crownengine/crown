name: render_pipeline_regressions

on: [push, pull_request]

jobs:
  recording-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
    - uses: actions/checkout@v6
    - name: Install compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ clang
    - name: Run recording regressions
      env:
        CXX: ${{ matrix.compiler }}
      run: python3 tests/render_pipeline/run.py --sanitize
